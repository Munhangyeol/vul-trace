services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulntrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulntrace}
      POSTGRES_DB: ${POSTGRES_DB:-vulntrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulntrace}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
